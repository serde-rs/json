name: Staging i128/u128 verification
on:
  push:
    branches: [staging/i128-direct-parse]
permissions:
  contents: read
jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo test --all-features
      - run: cargo test --features preserve_order
      - run: cargo test --features arbitrary_precision
      - run: cargo test --features float_roundtrip
      - run: cargo test --features raw_value
      - run: cargo test --features unbounded_depth
      - run: cargo check --no-default-features --features alloc
      - run: cargo check --no-default-features --features alloc,arbitrary_precision
      - run: cargo check --no-default-features --features alloc,raw_value
      - run: cargo clippy --lib --all-features -- -D warnings
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.71.0
      - run: cargo +1.71.0 check --lib --no-default-features --features alloc
      - run: cargo +1.71.0 check --lib --features arbitrary_precision
